# IMPORTANT: This file shows the STRUCTURE of required secrets.
# DO NOT commit actual values. Create the real secret with:
# kubectl create secret generic cloudcare-secrets \
#   --namespace=cloudcare \
#   --from-literal=POSTGRES_PASSWORD='<strong-password>' \
#   --from-literal=DATABASE_URL='postgresql://cloudcare:<password>@cloudcare-postgres:5432/cloudcare' \
#   --from-literal=SECRET_KEY='<32-char-hex-string>'
# ---
apiVersion: v1
kind: Secret
metadata:
  name: cloudcare-secrets
  namespace: cloudcare
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  DATABASE_URL: "REPLACE_WITH_ACTUAL_DATABASE_URL"
  SECRET_KEY: "REPLACE_WITH_ACTUAL_SECRET_KEY"
