apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcare-backend
  namespace: cloudcare
  labels:
    app: cloudcare-backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudcare-backend
  template:
    metadata:
      labels:
        app: cloudcare-backend
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/cloudcare-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudcare-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudcare-secrets
                  key: SECRET_KEY
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: cloudcare-config
                  key: CORS_ORIGINS
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: cloudcare-config
                  key: APP_VERSION
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcare-backend
  namespace: cloudcare
spec:
  selector:
    app: cloudcare-backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
