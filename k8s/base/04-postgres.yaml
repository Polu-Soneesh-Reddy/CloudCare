apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudcare-postgres
  namespace: cloudcare
  labels:
    app: cloudcare-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudcare-postgres
  template:
    metadata:
      labels:
        app: cloudcare-postgres
    spec:
      securityContext:
        runAsNonRoot: false  # postgres image requires root internally
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cloudcare-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: cloudcare-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudcare-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudcare"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "cloudcare"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: cloudcare-postgres
  namespace: cloudcare
spec:
  selector:
    app: cloudcare-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # Headless for StatefulSet-like access
  # NOTE: PostgreSQL is NOT exposed externally — internal cluster only
