version: '3.9'

networks:
  cloudcare-net:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  # ── PostgreSQL ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cloudcare-postgres
    restart: unless-stopped
    networks: [cloudcare-net]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudcare}
      POSTGRES_USER: ${POSTGRES_USER:-cloudcare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudcare_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudcare} -d ${POSTGRES_DB:-cloudcare}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend ─────────────────────────────────────────
  cloudcare-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudcare-backend
    restart: unless-stopped
    networks: [cloudcare-net]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudcare}:${POSTGRES_PASSWORD:-cloudcare_dev_password}@postgres:5432/${POSTGRES_DB:-cloudcare}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Frontend ────────────────────────────────────────
  cloudcare-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: cloudcare-frontend
    restart: unless-stopped
    networks: [cloudcare-net]
    ports:
      - "80:80"
    depends_on:
      - cloudcare-backend
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: cloudcare-prometheus
    restart: unless-stopped
    networks: [cloudcare-net]
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.2
    container_name: cloudcare-grafana
    restart: unless-stopped
    networks: [cloudcare-net]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-cloudcare123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${EC2_HOST:-localhost}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Node Exporter (host metrics) ────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: cloudcare-node-exporter
    restart: unless-stopped
    networks: [cloudcare-net]
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'

  # ── cAdvisor (container metrics) ────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    container_name: cloudcare-cadvisor
    restart: unless-stopped
    networks: [cloudcare-net]
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
``
